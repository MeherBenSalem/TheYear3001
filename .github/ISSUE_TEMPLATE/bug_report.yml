name: Bug report
description: Report a bug in Chronofall
labels: ["bug"]
body:
  - type: dropdown
    id: version_folder
    attributes:
      label: Minecraft / loader
      options:
        - 1.20.1 Fabric
        - 1.20.1 Forge
        - 1.21.1 Fabric
        - 1.21.1 NeoForge
        - 26.1.2 Fabric
        - 26.1.2 NeoForge
        - 26.2 Fabric
        - 26.2 NeoForge
        - 26.3 Fabric
        - 26.3 NeoForge
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: Paste relevant log sections (redact secrets)
