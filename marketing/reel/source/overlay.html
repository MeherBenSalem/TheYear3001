<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Display; src: url('fonts/orbitron.woff2'); font-weight: 400 900; }
@font-face { font-family: Body; src: url('fonts/exo2.woff2'); font-weight: 100 900; }
:root { --night: #070b1a; --flux: #38f3ff; --rift: #ff3fd2; --amber: #ffb547; --red: #ff5a6e; --ink: #e8f1ff; }
html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
* { box-sizing: border-box; }
.layer { position: absolute; inset: 0; }
#vignette { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(3,5,14,.5) 100%); }
#flash { background: #fff; opacity: 0; }
#dim { background: radial-gradient(ellipse at 50% 40%, rgba(7,11,26,.55), rgba(7,11,26,.9)); opacity: 0; }

/* captions */
#cap { position: absolute; left: 100px; right: 100px; top: 1180px; display: flex; flex-wrap: wrap; justify-content: center;
       gap: 2px 30px; font-family: Body; font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.04;
       transform-origin: 50% 50%; }
#cap span { display: inline-block; color: #fff; font-size: 88px; letter-spacing: 1px;
            -webkit-text-stroke: 12px #03050e; paint-order: stroke fill;
            text-shadow: 0 8px 0 rgba(3,5,14,.6), 0 0 30px rgba(3,5,14,.5); }
#cap span.on { color: var(--flux); text-shadow: 0 8px 0 rgba(3,5,14,.6), 0 0 34px rgba(56,243,255,.75); }
#cap.big span { font-size: 100px; }

/* the year counter in the hook */
#year { position: absolute; left: 0; right: 0; top: 250px; text-align: center; opacity: 0; }
#yearK { font-family: Display; font-weight: 700; font-size: 46px; letter-spacing: 22px; color: var(--rift);
         text-shadow: 0 4px 0 rgba(3,5,14,.8), 0 0 24px rgba(255,63,210,.8); margin-left: 22px; }
#yearN { font-family: Display; font-weight: 900; font-size: 250px; line-height: 1; letter-spacing: 6px;
         background: linear-gradient(180deg, #ffffff 0%, #bdfaff 40%, #38f3ff 70%, #1a9fd0 100%);
         -webkit-background-clip: text; background-clip: text; color: transparent;
         filter: drop-shadow(0 10px 0 rgba(3,5,14,.85)) drop-shadow(0 0 40px rgba(56,243,255,.55)); }
.ghost { position: absolute; left: 0; right: 0; top: 0; font-family: Display; font-weight: 900; font-size: 250px; line-height: 1;
         letter-spacing: 6px; opacity: .0; mix-blend-mode: screen; }

/* gadget labels */
#label { position: absolute; left: 0; right: 0; top: 230px; text-align: center; opacity: 0; }
#lname { font-family: Display; font-weight: 900; font-size: 104px; line-height: 1.05; letter-spacing: 4px; color: #fff;
         text-transform: uppercase; -webkit-text-stroke: 10px #03050e; paint-order: stroke fill; display: inline-block; }
#lbar { width: 360px; height: 7px; margin: 14px auto 12px; border-radius: 4px; transform-origin: 50% 50%; }
#lsub { font-family: Body; font-weight: 800; font-size: 46px; letter-spacing: 6px; text-transform: uppercase;
        -webkit-text-stroke: 8px #03050e; paint-order: stroke fill; display: inline-block; }

/* title card */
#title { opacity: 0; }
#logo { position: absolute; left: 50%; top: 430px; width: 460px; height: 460px; margin-left: -230px; border-radius: 34px;
        box-shadow: 0 0 120px rgba(255,63,210,.45), 0 0 0 4px rgba(56,243,255,.6); }
#t1 { position: absolute; left: 0; right: 0; top: 990px; text-align: center; font-family: Display; font-weight: 900;
      font-size: 108px; letter-spacing: 4px;
      background: linear-gradient(180deg, #ffffff 0%, #bdfaff 40%, #38f3ff 70%, #1a9fd0 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 30px rgba(56,243,255,.5)); }
#rule { position: absolute; left: 50%; top: 1160px; width: 700px; height: 4px; margin-left: -350px;
        background: linear-gradient(90deg, rgba(255,63,210,0), #ff3fd2 20%, #38f3ff 80%, rgba(56,243,255,0)); }
#t2 { position: absolute; left: 0; right: 0; top: 1190px; text-align: center; font-family: Body; font-weight: 800;
      font-size: 40px; letter-spacing: 3px; color: var(--ink); text-transform: uppercase; white-space: nowrap; }
#t3 { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-family: Display; font-weight: 700;
      font-size: 36px; letter-spacing: 6px; color: var(--amber); }
#t4 { position: absolute; left: 0; right: 0; top: 1372px; text-align: center; font-family: Body; font-weight: 700;
      font-size: 36px; letter-spacing: 4px; color: #9fb3d8; }
#shine { position: absolute; top: 970px; height: 190px; width: 220px; left: -300px;
         background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0));
         mix-blend-mode: overlay; filter: blur(6px); }

/* brand tag */
#brand { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-family: Display; font-weight: 700;
         font-size: 38px; letter-spacing: 10px; color: var(--flux); opacity: 0;
         text-shadow: 0 3px 0 rgba(3,5,14,.85), 0 0 18px rgba(56,243,255,.6); }

/* the closing question's comment prompt */
#comment { position: absolute; left: 50%; top: 1530px; display: flex; align-items: center; gap: 22px; white-space: nowrap;
           font-family: Display; font-weight: 800; font-size: 46px; letter-spacing: 3px; color: var(--night);
           background: var(--flux); padding: 20px 40px 18px; border-radius: 18px; opacity: 0; transform-origin: 50% 50%;
           box-shadow: 0 12px 0 rgba(3,5,14,.55), 0 0 50px rgba(56,243,255,.55); }
#comment svg { width: 54px; height: 54px; }
</style></head>
<body>
<div id="vignette" class="layer"></div>
<div id="dim" class="layer"></div>
<div id="brand">CHRONOFALL</div>

<div id="year"><div id="yearK">YEAR</div><div style="position:relative">
  <div id="yearN">2026</div><div class="ghost" id="g1" style="color:#ff3fd2">2026</div><div class="ghost" id="g2" style="color:#38f3ff">2026</div>
</div></div>

<div id="label"><div id="lname"></div><div id="lbar"></div><div id="lsub"></div></div>

<div id="title" class="layer">
  <img id="logo" src="icon.png">
  <div id="t1">CHRONOFALL</div>
  <div id="rule"></div>
  <div id="t2">The year 3001 crashed into your world</div>
  <div id="t3">FABRIC · FORGE · NEOFORGE</div>
  <div id="t4">Free on Modrinth &amp; CurseForge</div>
  <div id="shine"></div>
</div>

<div id="comment"><span>ANSWER BELOW</span>
  <svg viewBox="0 0 24 24"><path d="M12 3v15m0 0-6-6m6 6 6-6" fill="none" stroke="#070b1a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

<div id="cap"></div>
<div id="flash" class="layer"></div>

<script>
const CAPS = __CAPTIONS__;
const WORDS = __WORDS__;
const C = __CUES__;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .15, fo = .15) => clamp((t - a) / fi) * clamp((b - t) / fo);
const $ = id => document.getElementById(id);
// deterministic jitter for glitches (same frame, same offsets)
const hash = x => { const s = Math.sin(x * 12.9898) * 43758.5453; return s - Math.floor(s); };

let lastChunk = -1;
function captions(t) {
  const cap = $('cap');
  const i = CAPS.findIndex(c => t >= c.start - 0.03 && t < c.end);
  if (i < 0) { cap.style.opacity = 0; return; }
  const c = CAPS[i];
  if (i !== lastChunk) {
    cap.innerHTML = c.words.map(w => `<span>${w.text}</span>`).join('');
    cap.className = c.start >= C.capBig[0] && c.start < C.capBig[1] ? 'big' : '';
    lastChunk = i;
  }
  const spans = cap.querySelectorAll('span');
  c.words.forEach((w, k) => {
    const next = k + 1 < c.words.length ? c.words[k + 1].start : c.end;
    const on = t >= w.start - 0.03 && t < next;
    spans[k].classList.toggle('on', on);
    const p = clamp((t - w.start + 0.03) / 0.12);
    spans[k].style.transform = on ? `scale(${1 + 0.07 * Math.sin(Math.PI * clamp(p))})` : 'scale(1)';
  });
  const pop = back((t - c.start + 0.03) / 0.16);
  cap.style.opacity = clamp((t - c.start + 0.03) / 0.05) * clamp((c.end - t) / 0.06);
  cap.style.transform = `scale(${0.82 + 0.18 * pop})`;
}

function year(t) {
  const Y = C.year, el = $('year');
  const o = win(t, Y.t0, Y.t1, 0.05, 0.15);
  el.style.opacity = o;
  if (o <= 0) return;
  const u = (t - Y.t0) / 0.55;
  const n = Math.round(2026 + (3001 - 2026) * eo(u));
  ['yearN', 'g1', 'g2'].forEach(id => $(id).textContent = n);
  // RGB-split glitch while it counts, settling as it lands on 3001
  const g = (1 - clamp(u)) * 1.0 + (u > 1 ? 0.15 * Math.max(0, Math.sin(t * 40)) * (hash(Math.floor(t * 30)) > .8 ? 1 : 0) : 0);
  const j = hash(Math.floor(t * 30));
  $('g1').style.opacity = 0.7 * g; $('g1').style.transform = `translate(${-14 * g - 10 * j * g}px, ${4 * g}px)`;
  $('g2').style.opacity = 0.7 * g; $('g2').style.transform = `translate(${14 * g + 10 * j * g}px, ${-4 * g}px)`;
  const s = 0.6 + 0.4 * back((t - Y.t0) / 0.25);
  el.style.transform = `scale(${s})`;
}

let lastLabel = null;
function label(t) {
  const L = C.labels.find(l => t >= l.t0 && t < l.t1);
  const el = $('label');
  if (!L) { el.style.opacity = 0; return 0; }
  if (L !== lastLabel) {
    $('lname').textContent = L.name;
    $('lname').style.fontSize = '104px';
    const wdt = $('lname').getBoundingClientRect().width;
    if (wdt > 980) $('lname').style.fontSize = `${Math.floor(104 * 980 / wdt)}px`;  // one line, whatever the name
    $('lsub').textContent = L.sub;
    $('lsub').style.color = L.color;
    $('lname').style.textShadow = `0 8px 0 rgba(3,5,14,.6), 0 0 38px ${L.color}`;
    $('lbar').style.background = L.color;
    $('lbar').style.boxShadow = `0 0 24px ${L.color}`;
    lastLabel = L;
  }
  const u = t - L.t0;
  const o = clamp(u / 0.08) * clamp((L.t1 - t) / 0.07);
  el.style.opacity = o;
  const gl = u < 0.12 ? (hash(Math.floor(t * 30) + 7) - 0.5) * 30 * (1 - u / 0.12) : 0;
  $('lname').style.transform = `translateX(${(1 - eo(u / 0.22)) * -70 + gl}px) scale(${0.86 + 0.14 * back(u / 0.24)})`;
  $('lbar').style.transform = `scaleX(${eo((u - 0.05) / 0.25)})`;
  $('lsub').style.opacity = clamp((u - 0.07) / 0.12);
  $('lsub').style.transform = `translateY(${(1 - eo((u - 0.07) / 0.25)) * 18}px)`;
  return o;
}

function frame(t) {
  let fl = 0;
  for (const [at, peak] of C.flashes) {
    if (t >= at && t < at + 0.3) fl = Math.max(fl, peak * Math.pow(1 - (t - at) / 0.3, 2));
  }
  $('flash').style.opacity = fl;

  const lo = label(t);
  $('brand').style.opacity = 0.8 * Math.max(0, ...C.brand.map(([a, b]) => win(t, a, b, 0.3, 0.2))) * (1 - lo);
  year(t);

  // title card
  const [T0, T1] = C.title, TW = C.titleWord;
  const to = win(t, T0, T1, 0.12, 0.18);
  $('title').style.opacity = to;
  // a slow push on the whole card, so it is never a still frame
  $('title').style.transform = `scale(${1 + 0.045 * clamp((t - T0) / (T1 - T0))})`;
  $('dim').style.opacity = 0.8 * win(t, T0, T1, 0.2, 0.2);
  if (to > 0) {
    const lp = back((t - T0 - 0.02) / 0.4);
    $('logo').style.transform = `scale(${0.55 + 0.45 * lp}) rotate(${(1 - eo((t - T0) / .8)) * -30}deg)`;
    $('logo').style.opacity = clamp((t - T0) / 0.15);
    const p1 = eo((t - TW) / 0.45);
    const gl = t >= TW && t < TW + 0.18 ? (hash(Math.floor(t * 30) + 3) - 0.5) * 40 : 0;
    $('t1').style.opacity = clamp((t - TW + 0.04) / 0.12);
    $('t1').style.letterSpacing = `${4 + (1 - p1) * 30}px`;
    $('t1').style.transform = `translateX(${gl}px)`;
    $('rule').style.transform = `scaleX(${eo((t - TW - 0.1) / 0.5)})`;
    $('t2').style.opacity = clamp((t - TW - 0.2) / 0.25);
    $('t2').style.transform = `translateY(${(1 - eo((t - TW - .2) / .35)) * 24}px)`;
    $('t3').style.opacity = clamp((t - TW - 0.55) / 0.3);
    $('t4').style.opacity = clamp((t - TW - 0.8) / 0.3);
    $('shine').style.left = `${-300 + 1700 * eio((t - TW - 0.4) / 0.9)}px`;
  }

  // comment prompt after the closing question; clear before the loop seam
  const [ca, cb] = C.comment;
  const cm = $('comment');
  cm.style.opacity = win(t, ca, cb, 0.08, 0.2);
  const cs = 0.5 + 0.5 * back((t - ca) / 0.22);
  cm.style.transform = `translateX(-50%) scale(${cs}) translateY(${Math.sin((t - ca) * 7) * 6 * clamp((t - ca - .25) / .2)}px)`;

  captions(t);
}
window.frame = frame;
</script>
</body></html>
